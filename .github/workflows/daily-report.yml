name: Daily AI Report

on:
  schedule:
    # 每天北京时间 08:30 运行 (UTC 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests jinja2 feedparser beautifulsoup4
          
      - name: Generate daily report
        env:
          AIHOT_API_URL: ${{ secrets.AIHOT_API_URL }}
        run: |
          python scripts/generate_report.py
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          
      - name: Send notification to Feishu
        if: success() && env.FEISHU_WEBHOOK != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {
                    \"tag\": \"plain_text\",
                    \"content\": \"📰 AI 科技日报已生成\"
                  },
                  \"template\": \"blue\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"**日期:** $DATE\\n**来源:** AI Hot API\\n**状态:** ✅ 生成成功\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"查看日报\"
                        },
                        \"type\": \"primary\",
                        \"url\": \"https://infish111.github.io/daily-ai-reports/$DATE.html\"
                      },
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"查看存档\"
                        },
                        \"type\": \"default\",
                        \"url\": \"https://infish111.github.io/daily-ai-reports/\"
                      }
                    ]
                  }
                ]
              }
            }" || echo "Feishu notification skipped"
          
      - name: Report status
        if: success()
        run: |
          echo "✅ Daily report generated successfully!"
          echo "📅 Date: $(date +%Y-%m-%d)"
          echo "🌐 URL: https://infish111.github.io/daily-ai-reports/"
