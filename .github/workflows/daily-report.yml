name: Daily AI Report

on:
  schedule:
    # 每天北京时间 08:30 运行 (UTC 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests jinja2
          
      - name: Generate daily report
        env:
          AIHOT_API_URL: ${{ secrets.AIHOT_API_URL }}
        run: |
          python scripts/generate_report.py
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Send notification to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"📰 AI 科技日报已生成\\n日期: $DATE\\n链接: https://infish111.github.io/daily-ai-reports/$DATE.html\"
              }
            }" || true
          
      - name: Report status
        if: success()
        run: |
          echo "✅ Daily report generated successfully!"
          echo "📅 Date: $(date +%Y-%m-%d)"
          echo "🌐 URL: https://infish111.github.io/daily-ai-reports/"
